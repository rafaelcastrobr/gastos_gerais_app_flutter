name: Build APK (CI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/build-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gastos-gerais-ci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gastos-gerais-ci-apk
          path: gastos-gerais-ci.apk
